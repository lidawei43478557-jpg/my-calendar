<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>魔强统一战 HTML5 复刻</title>
    <style>html,body{background:#0b1020;width:100%;height:100%;margin:0;padding:0;overflow:hidden}#game{width:100%;height:100%;position:fixed;top:0;bottom:0;left:0;right:0}</style>
    <script type="module" crossorigin src="./assets/index-BNjBxvlS.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // 静默横屏锁定：首次触摸时尝试锁定横屏，失败（如 iOS Safari 不支持）自动忽略，不弹任何提示。
      (function () {
        function lockLandscape() {
          try {
            var so = screen.orientation;
            if (so && typeof so.lock === 'function') {
              var p = so.lock('landscape');
              if (p && typeof p.catch === 'function') p.catch(function () {});
            }
          } catch (e) { /* 忽略：浏览器不支持时静默 */ }
        }
        window.addEventListener('pointerdown', lockLandscape, { once: true });
        window.addEventListener('touchstart', lockLandscape, { once: true });
      })();
    </script>
  </body>
</html>
