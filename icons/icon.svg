<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA05C"/>
      <stop offset="0.5" stop-color="#F2562B"/>
      <stop offset="1" stop-color="#C2291B"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2562B"/>
      <stop offset="1" stop-color="#D3301D"/>
    </linearGradient>
    <linearGradient id="today" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#F0521F"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="1" stop-color="#FFC463"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip"><rect x="106" y="136" width="300" height="300" rx="58"/></clipPath>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="424" cy="112" r="48" fill="#fff"/>
      <circle cx="452" cy="92" r="44" fill="#000"/>
    </mask>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6E1509" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>

  <!-- 农历意象：金色月牙 -->
  <g mask="url(#crescent)">
    <circle cx="424" cy="112" r="48" fill="url(#moon)"/>
  </g>

  <!-- 日历卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="106" y="136" width="300" height="300" rx="58" fill="#FFFFFF"/>
  </g>

  <g clip-path="url(#cardClip)">
    <!-- 红色抬头 -->
    <rect x="106" y="136" width="300" height="70" fill="url(#hdr)"/>
    <rect x="106" y="196" width="300" height="10" fill="#000" opacity="0.09"/>
    <!-- 日期格子 -->
    <g fill="#E8EAEF">
      <rect x="137" y="241" width="40" height="40" rx="12"/>
      <rect x="203" y="241" width="40" height="40" rx="12"/>
      <rect x="269" y="241" width="40" height="40" rx="12"/>
      <rect x="335" y="241" width="40" height="40" rx="12"/>
      <rect x="137" y="301" width="40" height="40" rx="12"/>
      <rect x="203" y="301" width="40" height="40" rx="12"/>
      <rect x="335" y="301" width="40" height="40" rx="12"/>
      <rect x="137" y="361" width="40" height="40" rx="12"/>
      <rect x="203" y="361" width="40" height="40" rx="12"/>
      <rect x="269" y="361" width="40" height="40" rx="12"/>
      <rect x="335" y="361" width="40" height="40" rx="12"/>
    </g>
    <!-- 今天：橙色高亮 -->
    <rect x="269" y="301" width="40" height="40" rx="12" fill="url(#today)"/>
    <circle cx="289" cy="321" r="11" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <!-- 活页环 -->
  <g fill="#FFFFFF">
    <rect x="176" y="108" width="20" height="52" rx="10"/>
    <rect x="316" y="108" width="20" height="52" rx="10"/>
  </g>
  <g fill="#000" opacity="0.06">
    <rect x="176" y="140" width="20" height="20" rx="10"/>
    <rect x="316" y="140" width="20" height="20" rx="10"/>
  </g>
</svg>
