<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>魔强统一战 HTML5 复刻</title>
    <style>html,body{width:100%;height:100%;background:#0b1020;height:100dvh;margin:0;padding:0;overflow:hidden}#game{width:100%;height:100%;height:100dvh;position:fixed;top:0;bottom:0;left:0;right:0}#loading{z-index:10;color:#cfe8ff;background:#0b1020;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-family:sans-serif;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#loading .ring{border:4px solid #cfe8ff40;border-top-color:#ffd23f;border-radius:50%;width:46px;height:46px;animation:.9s linear infinite spin}#loading .t{letter-spacing:1px;font-size:15px}@keyframes spin{to{transform:rotate(360deg)}}#rotate,#splash{z-index:20;color:#fff;text-align:center;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;flex-direction:column;justify-content:center;align-items:center;font-family:sans-serif;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#rotate{z-index:30;background:#0b1020;gap:16px}#rotate .ico{font-size:56px;animation:1.6s ease-in-out infinite rock}@keyframes rock{0%,to{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}#rotate .t{letter-spacing:1px;font-size:19px;font-weight:700}#rotate .s{color:#9fb6d6;font-size:13px}#splash{z-index:20;cursor:pointer;background:#0b1020 url(title-bg.jpg) 50%/cover no-repeat;gap:22px}#splash .game-title{display:none}#splash .start-btn{color:#fff;letter-spacing:3px;background:#1f6f3a;border:2px solid #4fa36a;border-radius:999px;margin-top:6px;padding:14px 44px;font-size:20px;font-weight:700}#splash .hint{color:#9fb6d6;font-size:13px}</style>
    <script type="module" crossorigin src="./assets/index-B5XNiPzL.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-BSBLrfai.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <div class="ring"></div>
      <div class="t">魔强统一战 加载中…</div>
    </div>

    <!-- 竖屏提示：竖屏时盖住游戏，引导用户横屏（横屏即自动隐藏） -->
    <div id="rotate">
      <div class="ico">🔄</div>
      <div class="t">请将手机横屏游玩</div>
      <div class="s">横屏体验更佳 · 战斗画面更完整</div>
    </div>

    <!-- 进入遮罩：首次点击在用户手势内解锁并播放 BGM（浏览器禁止无手势自动播放） -->
    <div id="splash">
      <div class="game-title">幽游白书 · 魔强统一战</div>
      <div class="start-btn">点击开始</div>
      <div class="hint">点击后开启背景音乐</div>
    </div>

    <script>
      // 强制让 Phaser 用真实可视区域重新计算 FIT 缩放。
      // 部分机型在“点击开始 / 旋转 / 地址栏收起”后视口尺寸会变化，若不及时 refresh，
      // Scale.FIT 会沿用旧尺寸 → 画布被放大、铺不满屏幕、且点击坐标错位（点不中角色）。
      var _refreshQueued = false;
      function refreshScale() {
        try {
          var g = window.__game;
          if (g && g.scale && typeof g.scale.refresh === 'function') g.scale.refresh();
        } catch (e) { /* ignore */ }
      }
      function refreshScaleSoon() {
        if (_refreshQueued) return;
        _refreshQueued = true;
        requestAnimationFrame(function () {
          _refreshQueued = false;
          refreshScale();
        });
      }

      // 注意：已移除 screen.orientation.lock('landscape')。该调用在部分 Android 机型上会
      // 留下“横屏锁定”视口状态并在刷新后延续，导致第二次打开时画布尺寸测量偏大（放大/点不中）。
      // 竖屏统一由 #rotate 遮罩兜底引导横屏，体验更稳。

      // 旋转 / 进入遮罩控制
      (function () {
        var rotate = document.getElementById('rotate');
        var splash = document.getElementById('splash');
        var started = false;
        function update() {
          var portrait = window.innerHeight > window.innerWidth;
          rotate.style.display = portrait ? 'flex' : 'none';
          splash.style.display = (!started && !portrait) ? 'flex' : 'none';
        }
        function start() {
          started = true;
          splash.style.display = 'none';
          rotate.style.display = 'none';
          // 必须在用户手势内触发音频；main.ts 已把 unlockBgm 挂到 window.__unlockBgm
          try { if (window.__unlockBgm) window.__unlockBgm(); } catch (e) { /* ignore */ }
          // 进入游戏后立刻（以及稍后再）刷新缩放，确保画布精确贴合当前视口
          refreshScale();
          setTimeout(refreshScale, 250);
          setTimeout(refreshScale, 700);
        }
        window.addEventListener('resize', function () { update(); refreshScaleSoon(); });
        window.addEventListener('orientationchange', function () { update(); refreshScaleSoon(); });
        splash.addEventListener('click', start);
        splash.addEventListener('touchend', function (e) { e.preventDefault(); start(); });
        update();
      })();
    </script>
  </body>
</html>
