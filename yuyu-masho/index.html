<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>魔强统一战 HTML5 复刻</title>
    <style>html,body{background:#0b1020;width:100%;height:100%;margin:0;padding:0;overflow:hidden}#game{width:100%;height:100%;position:fixed;top:0;bottom:0;left:0;right:0}#loading{z-index:10;color:#cfe8ff;background:#0b1020;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-family:sans-serif;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#loading .ring{border:4px solid #cfe8ff40;border-top-color:#ffd23f;border-radius:50%;width:46px;height:46px;animation:.9s linear infinite spin}#loading .t{letter-spacing:1px;font-size:15px}@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" crossorigin src="./assets/index-BmWiKChE.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-BSBLrfai.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <div class="ring"></div>
      <div class="t">魔强统一战 加载中…</div>
    </div>
    <script>
      // 静默横屏锁定：首次触摸时尝试锁定横屏，失败（如 iOS Safari 不支持）自动忽略，不弹任何提示。
      (function () {
        function lockLandscape() {
          try {
            var so = screen.orientation;
            if (so && typeof so.lock === 'function') {
              var p = so.lock('landscape');
              if (p && typeof p.catch === 'function') p.catch(function () {});
            }
          } catch (e) { /* 忽略：浏览器不支持时静默 */ }
        }
        window.addEventListener('pointerdown', lockLandscape, { once: true });
        window.addEventListener('touchstart', lockLandscape, { once: true });
      })();
    </script>
  </body>
</html>
