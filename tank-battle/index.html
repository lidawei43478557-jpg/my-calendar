<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>坦克大战 · FC 复刻</title>
<meta name="description" content="红白机坦克大战复刻版：纯前端单文件，iPhone 触屏可玩，离线可安装">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="坦克大战">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ==========================================================================
   基础重置：禁缩放、禁选中、禁橡皮筋滚动（iOS 必需）
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: #000; color: #e8e8e8; overflow: hidden;
  font-family: "PingFang SC", "Heiti SC", "Microsoft YaHei", system-ui, sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; }

/* ==========================================================================
   主容器：竖屏纵向排列（战场在上，触控在下），横屏时按钮浮到两侧黑边
   ========================================================================== */
#app {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: #000;
}

/* ---------- 顶部信息栏：关卡 / 生命 / 剩余敌人 / 分数 ---------- */
#hud {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; font-size: 13px; line-height: 1;
  background: #101014; border-bottom: 1px solid #26262c;
}
#hud .item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#hud .label { color: #8a8a95; font-size: 11px; }
#hud .val { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
#hud .val.life { color: #ffd24a; }
#hud .val.enemy { color: #ff7a5c; }
#hud .val.stage { color: #7fd06a; }
#hud .spacer { flex: 1 1 auto; }
#btn-pause {
  min-width: 44px; height: 44px; flex: 0 0 auto; border: 0; border-radius: 10px;
  background: #232329; color: #e8e8e8; font-size: 16px; font-family: inherit;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
#btn-pause:active { background: #34343c; }

/* ---------- 战场区：正方形画布居中 ---------- */
#stage {
  flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
  min-height: 0; min-width: 0; padding: 4px; position: relative;
}
#frame { position: relative; line-height: 0; }
#cv {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000; border: 2px solid #2b2b33; border-radius: 2px;
}

/* ---------- 覆盖层：开始 / 暂停 / 过关 / 结束 ---------- */
/* 三段式：标题(顶) / 内容(中，超出可滚动) / 按钮(底)，保证首尾不被长文案挤出屏幕 */
#overlay {
  position: absolute; inset: 0; display: none; flex-direction: column;
  background: rgba(0, 0, 0, .86); text-align: center; padding: 10px 16px;
  border-radius: 2px; line-height: 1.5;
}
#overlay.show { display: flex; }
#ov-head { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 2px; }
#ov-body {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  align-items: center; gap: 10px; padding: 8px 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
#ov-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding-bottom: 2px; }
#ov-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; flex: 0 0 auto; }
#ov-title.small { font-size: 18px; }
#ov-sub { font-size: 13px; color: #b9b9c4; max-width: 90%; }
#ov-stats { font-size: 13px; color: #ffd24a; font-variant-numeric: tabular-nums; }
#ov-tips { font-size: 12px; color: #9a9aa6; line-height: 1.7; max-width: 94%; text-align: left; }
#ov-tips .help p { margin: 0 0 9px; }
#ov-tips .help p:last-child { margin-bottom: 0; }
#ov-tips .help b { color: #e6e6ee; font-weight: 600; }
#ov-tips b { color: #d8d8e0; font-weight: 600; }
.btn {
  min-height: 48px; min-width: 148px; padding: 0 22px; border: 0; border-radius: 12px;
  background: #f0b429; color: #231a00; font-size: 17px; font-weight: 700;
  font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.btn:active { background: #d99e1c; }
.btn.ghost { background: #2c2c34; color: #dcdce4; font-weight: 500; }
.btn.ghost:active { background: #3a3a44; }
#ov-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- 地图预览 + 选关网格（开始菜单用）---------- */
#menu-preview {
  image-rendering: pixelated; image-rendering: crisp-edges;
  width: 156px; height: 156px; background: #000; border: 2px solid #2b2b33; border-radius: 2px;
  margin: 6px 0; display: none;
}
#ov-stages {
  display: none; grid-template-columns: repeat(6, 1fr); gap: 6px;
  max-width: 252px; margin: 8px auto 4px; width: 100%;
}
.stage-cell {
  min-height: 34px; border: 1px solid #34343c; border-radius: 6px; background: #1e1e24;
  color: #cfcfd8; font-size: 14px; font-family: inherit; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.stage-cell:active { background: #34343c; }
.stage-cell.cur { border-color: #f0b429; color: #f0b429; font-weight: 700; }

/* ---------- 联机大厅 ---------- */
#net-panel {
  display: none; flex-direction: column; align-items: center; gap: 10px;
  width: 100%; max-width: 300px; margin: 8px auto;
}
#net-panel.show { display: flex; }
#net-status { font-size: 13px; color: #b9b9c4; max-width: 96%; }
#net-code {
  font-size: 34px; font-weight: 700; letter-spacing: 8px; color: #f0b429;
  font-variant-numeric: tabular-nums; min-height: 40px; padding-left: 8px;
}
#net-input {
  width: 200px; height: 54px; text-align: center; font-size: 26px; font-weight: 700;
  letter-spacing: 10px; padding-left: 10px; text-transform: uppercase;
  background: #1e1e24; color: #f0b429; border: 2px solid #3a3a44; border-radius: 10px;
  font-family: inherit; display: none;
}
#net-input.show { display: block; }
#net-input::placeholder { font-size: 14px; letter-spacing: 1px; color: #6a6a75; font-weight: 400; }

/* ---------- 触控区 ---------- */
#pad {
  flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 6px 22px calc(4px + env(safe-area-inset-bottom)) 22px; gap: 12px;
}
/* ---------- 圆形虚拟摇杆：底座 + 可拖动拇指 ---------- */
#dpad {
  position: relative; width: 168px; height: 168px; flex: 0 0 auto;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, #2a2a31, #16161b 72%);
  border: 2px solid #34343c; box-shadow: inset 0 0 18px rgba(0,0,0,.55);
  touch-action: none; overflow: visible;
}
/* 底座上的十字参考线（仅装饰，提示四方向） */
#dpad .cross { position: absolute; inset: 0; pointer-events: none; }
#dpad .cross::before, #dpad .cross::after {
  content: ''; position: absolute; background: rgba(255,255,255,.05);
}
#dpad .cross::before { left: 50%; top: 10%; width: 1px; height: 80%; transform: translateX(-.5px); }
#dpad .cross::after  { top: 50%; left: 10%; height: 1px; width: 80%; transform: translateY(-.5px); }
/* 可拖动的拇指 */
#stick {
  position: absolute; left: 50%; top: 50%; width: 74px; height: 74px;
  margin-left: -37px; margin-top: -37px; border-radius: 50%;
  background: radial-gradient(circle at 50% 36%, #565662, #2c2c34 78%);
  border: 2px solid #5a5a66; box-shadow: 0 2px 6px rgba(0,0,0,.5);
  pointer-events: none; will-change: transform;
}
#stick::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
  margin: -9px 0 0 -9px; border-radius: 50%; background: rgba(255,210,74,.35);
}
/* 开火键：大圆按钮，支持长按连发 */
#fire {
  width: 104px; height: 104px; border-radius: 50%; flex: 0 0 auto;
  background: radial-gradient(circle at 50% 38%, #ff8b6a, #d34a26 70%);
  color: #fff; font-size: 17px; font-weight: 700; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #ff9d7d; touch-action: none; cursor: pointer;
}
#fire:active, #fire.on { background: radial-gradient(circle at 50% 38%, #ffb199, #e85a30 70%); }
/* 触控右侧：音效开关放在开火键"左侧"且与其同高，避免误触开火键正下方 */
#pad-side { display: flex; flex-direction: row; align-items: flex-end; gap: 14px; }
#btn-sound {
  min-width: 64px; height: 64px; border: 0; border-radius: 14px; background: #1e1e24;
  color: #8a8a95; font-size: 22px; line-height: 1; font-family: inherit; cursor: pointer;
  border: 1px solid #33333c;
}

/* ==========================================================================
   横屏：按钮浮到战场左右两侧的黑边上
   ========================================================================== */
@media (orientation: landscape) {
  #app { flex-direction: column; }
  #hud { padding: 4px 10px; }
  #pad {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    pointer-events: none; padding: 0; display: block;
  }
  #dpad {
    position: absolute; left: calc(10px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom));
    pointer-events: auto; width: 150px; height: 150px;
  }
  #stick { width: 66px; height: 66px; margin-left: -33px; margin-top: -33px; }
  #pad-side {
    position: absolute; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
    pointer-events: auto;
  }
  #fire { width: 96px; height: 96px; }
}

/* 极矮屏（横屏小机型）压缩摇杆 */
@media (orientation: landscape) and (max-height: 430px) {
  #dpad { width: 126px; height: 126px; }
  #stick { width: 56px; height: 56px; margin-left: -28px; margin-top: -28px; }
  #fire { width: 84px; height: 84px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- 顶部信息栏 -->
  <div id="hud">
    <div class="item"><span class="label">关卡</span><span class="val stage" id="hud-stage">1</span></div>
    <div class="item"><span class="label">生命</span><span class="val life" id="hud-life">5</span></div>
    <div class="item"><span class="label">敌人</span><span class="val enemy" id="hud-enemy">20</span></div>
    <div class="spacer"></div>
    <div class="item"><span class="label">得分</span><span class="val" id="hud-score">0</span></div>
    <div class="item"><span class="label">最高</span><span class="val" id="hud-best">0</span></div>
    <button id="btn-pause" type="button" aria-label="暂停">❚❚</button>
  </div>

  <!-- 战场 -->
  <div id="stage">
    <div id="frame">
      <canvas id="cv" width="224" height="208"></canvas>
    </div>
    <div id="overlay">
      <div id="ov-head">
        <div id="ov-title">坦克大战</div>
        <div id="ov-sub">红白机经典复刻 · 纯本地运行</div>
        <div id="ov-stats"></div>
      </div>
      <div id="ov-body">
        <canvas id="menu-preview" width="104" height="104"></canvas>
        <div id="net-panel">
          <div id="net-status"></div>
          <div id="net-code"></div>
          <input id="net-input" type="text" maxlength="4" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="输入 4 位房间码">
        </div>
        <div id="ov-tips"></div>
        <div id="ov-stages"></div>
      </div>
      <div id="ov-foot">
        <div id="ov-row"></div>
      </div>
    </div>
  </div>

  <!-- 触控区 -->
  <div id="pad">
    <div id="dpad">
      <div class="cross"></div>
      <div id="stick"></div>
    </div>
    <div id="pad-side">
      <button id="btn-sound" type="button" aria-label="音效开关">🔊</button>
      <button id="fire" type="button">开火</button>
    </div>
  </div>

</div>
<script>
"use strict";
(function () {


/* ==========================================================================
   模块 1：常量配置 CONFIG（所有可调参数都在这里）
   ========================================================================== */

/* ==========================================================================
   模块 1：常量配置（CONFIG）
   所有可调参数集中在这里，改这一个对象就能调手感 / 难度 / 时长
   ========================================================================== */

var CONFIG = {
  /* ---- 画布与网格（单位：逻辑像素，1 tile = 8px）----
     战场为竖屏矩形：横向固定 13 个"块"（26 tile = 208px），
     纵向块数 BH_BLOCKS 在启动时按设备可用高度动态计算，从而最大化利用手机纵向空间。
     所有尺寸都由此推导，切勿在别处硬编码 26 / 208 / 224。---- */
  TILE: 8,              // 一个地形小格边长
  BW_BLOCKS: 13,        // 横向块数（13 块 = 26 tile = 208px，固定）
  BH_BLOCKS: 22,        // 纵向块数（默认值，启动时按设备高度再校准）
  GRID_W: 26,           // 横向 tile 数 = BW_BLOCKS * 2
  GRID_H: 44,           // 纵向 tile 数 = BH_BLOCKS * 2（启动时校准）
  FIELD_W: 208,         // 战场宽 = GRID_W * TILE
  FIELD_H: 352,         // 战场高 = GRID_H * TILE（启动时校准）
  SIDEBAR: 16,          // 右侧信息栏宽度
  CANVAS_W: 224,        // 画布总宽 = FIELD_W + SIDEBAR
  CANVAS_H: 352,        // 画布总高 = FIELD_H（启动时校准）

  /* 按"纵向块数"重算所有派生尺寸（启动 / 旋屏校准时调用） */
  setPortraitHeight: function (bh) {
    CONFIG.BH_BLOCKS = bh;
    CONFIG.GRID_H = bh * 2;
    CONFIG.FIELD_H = CONFIG.GRID_H * CONFIG.TILE;
    CONFIG.CANVAS_H = CONFIG.FIELD_H;
  },

  /* ---- 实体尺寸 ---- */
  TANK: 16,             // 坦克边长（= 2 tile，即需求中"每格为坦克的 1/2 大小"）
  BULLET_W: 3,          // 子弹宽
  BULLET_H: 4,          // 子弹高
  ITEM: 16,             // 道具边长

  /* ---- 移动速度（像素 / 秒）----
     依据 NES 原版反汇编实测（60fps，子弹每帧 2px=120、强化弹 4px=240；
     坦克按 8px 网格 + 各档节奏，绝对速度比旧值更贴近原版"沉稳"手感）---- */
  SPEED: {
    player: 54,         // 玩家坦克（原版基础档：约 0.9px/帧，稳健不飘）
    normal: 38,         // 普通敌坦克（比玩家略慢，原版基础敌）
    fast: 76,           // 快速敌坦克（约 2× 普通，原版最快档）
    armor: 34,          // 装甲敌坦克（最慢，原版装甲档）
    bullet: 120,        // 子弹（原版默认档：2px/帧）
    bulletPower: 240    // 强化后的子弹（吃星后：4px/帧，原版快弹档）
  },

  /* ---- 血量 ---- */
  HP: { player: 1, normal: 1, fast: 1, armor: 4 },

  /* ---- 关卡与敌人 ---- */
  ENEMY_PER_STAGE: 20,      // 每关敌坦克总数
  MAX_ON_SCREEN: 4,         // 同屏最多敌人
  SPAWN_INTERVAL: 2.6,      // 出场间隔（秒），随关卡递减
  SPAWN_BLINK: 1.2,         // 出场闪烁动画时长（秒）
  PLAYER_LIVES: 5,          // 初始生命
  RESPAWN_INVINCIBLE: 3.0,  // 重生无敌时长（秒）

  /* ---- 开火 ---- */
  BULLET_MAX_BASE: 1,       // 初始同屏子弹数
  BULLET_MAX_POWER: 2,      // 吃满星星后可同屏 2 发（连发）
  FIRE_COOLDOWN: 0.16,      // 连发最小间隔（秒）
  ENEMY_FIRE_MIN: 0.6,      // 敌人开火间隔下限（随关卡变快）
  ENEMY_FIRE_MAX: 2.2,      // 敌人开火间隔上限

  /* ---- 道具时长（秒）---- */
  ITEM_DURATION: {
    helmet: 10,   // 头盔：无敌
    shovel: 15,   // 铲子：基地周围砖墙变钢墙
    clock: 8,     // 时钟：冻结敌人
    exist: 22     // 道具在地上存在的时间（最后 5 秒闪烁）
  },
  ITEM_BLINK_AT: 17,        // 剩余多少秒开始闪烁提示
  ITEM_DROP_CHANCE: 0.22,   // 每辆敌坦克被击毁后掉落道具的概率（原版靠"红坦克"，这里改为概率掉落）

  /* ---- 难度递进（每过一关的系数）---- */
  STAGE_SPEED_STEP: 1.035,  // 敌人速度每关乘数
  STAGE_FIRE_STEP: 0.93,    // 敌人开火间隔每关乘数（越小越频繁）
  STAGE_SPAWN_STEP: 0.96,   // 出场间隔每关乘数
  STAGE_ARMOR_FROM: 3,      // 第几关开始出现装甲坦克
  STAGE_FAST_FROM: 2,       // 第几关开始出现快速坦克

  /* ---- 计分 ---- */
  SCORE: { normal: 100, fast: 200, armor: 400, item: 500, stageClear: 1000 },

  /* ---- 循环 ---- */
  STEP: 1 / 60,             // 固定时间步长
  MAX_FRAME_DT: 0.25        // 单帧最大补偿时间，防止切后台回来一次性跑飞
};

/* ---- 地形 tile 类型 ---- */
var T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_WATER = 3, T_GRASS = 4;

/* ---- 方向：上右下左 ---- */
var DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
var DIR_VEC = [[0, -1], [1, 0], [0, 1], [-1, 0]];

/* ---- 敌坦克类型 ---- */
var ETYPE = { NORMAL: 0, FAST: 1, ARMOR: 2 };

/* ---- 道具类型 ---- */
var ITEM_STAR = 0, ITEM_GRENADE = 1, ITEM_HELMET = 2, ITEM_SHOVEL = 3, ITEM_TANK = 4, ITEM_CLOCK = 5;
var ITEM_NAMES = ['星星', '手雷', '头盔', '铲子', '坦克', '时钟'];

/* ---- FC 原版配色 ---- */
var COLORS = {
  bg: '#000000',
  brick: '#c8632f', brickDark: '#54260f', brickLite: '#e89060',
  steel: '#a9b0b5', steelDark: '#6b7276', steelLite: '#e2e9ed',
  water: '#2a4bd8', waterLite: '#5c7bff',
  grass: '#2f8f3f', grassDark: '#1e6a2b',
  player: '#e8c020', playerDark: '#8f7400', playerLite: '#ffe987',
  playerAlt: '#4ad0e8', playerAltDark: '#1d8fa8',
  enemyNormal: '#c8ccd0', enemyNormalDark: '#7d838a',
  enemyFast: '#9ad8f0', enemyFastDark: '#4e93b3',
  armor4: '#e8c020', armor3: '#5ac44a', armor2: '#e88a20', armor1: '#c8ccd0',
  armorDark: '#6a6a70',
  bullet: '#ffffff', bulletLite: '#ffe987',
  base: '#d8d8d8', baseDark: '#8a8a90', baseDead: '#5a5a60',
  hud: '#ffffff', text: '#e8e8e8',
  itemStar: '#ffe987', itemGrenade: '#9aa0a8', itemHelmet: '#c8ccd0',
  itemShovel: '#e8e8e8', itemTank: '#5ac44a', itemClock: '#e8503c'
};

/* ---- 敌人被击毁时的爆炸颜色 ---- */
var EXPLOSION_COLORS = ['#ffffff', '#ffe987', '#ff8a3c', '#d85a2a'];

/* ==========================================================================
   通用工具函数
   ========================================================================== */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(n) { return Math.random() * n; }
function randInt(n) { return Math.floor(Math.random() * n); }
function pick(arr) { return arr[randInt(arr.length)]; }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }

/* 轴对齐矩形相交 */
function hitRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

/* 把坐标吸附到 tile 网格（转向时的"网格对齐手感"）*/

/* --------------------------------------------------------------------------
   把"块"地图展开成 tile 层（横向固定 13 块 = 26 tile；纵向块数 = BH_BLOCKS）
   每个块变成 2x2 个 tile；砖块按 tile 独立存储，实现原版"逐小块被打掉"
   块行不足 BH_BLOCKS 时纵向平铺，保证兜底关卡也能填满整幅战场。
   -------------------------------------------------------------------------- */
function buildMap(blockRows) {
  var rows = blockRows.length;
  var tiles = new Uint8Array(CONFIG.GRID_W * CONFIG.GRID_H);
  for (var by = 0; by < CONFIG.BH_BLOCKS; by++) {
    var row = blockRows[by % rows] || '';
    for (var bx = 0; bx < CONFIG.BW_BLOCKS; bx++) {
      var ch = row.charAt(bx);
      var t = T_EMPTY;
      if (ch === 'B') t = T_BRICK;
      else if (ch === 'S') t = T_STEEL;
      else if (ch === 'W') t = T_WATER;
      else if (ch === 'G') t = T_GRASS;
      if (t === T_EMPTY) continue;
      for (var dy = 0; dy < 2; dy++) {
        for (var dx = 0; dx < 2; dx++) {
          tiles[(by * 2 + dy) * CONFIG.GRID_W + (bx * 2 + dx)] = t;
        }
      }
    }
  }
  return tiles;
}

/* tile 坐标 -> 索引 */
function tileIdx(tx, ty) { return ty * CONFIG.GRID_W + tx; }

/* 取 tile 类型（越界视为钢墙，防止走出战场） */
function tileAt(tiles, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= CONFIG.GRID_W || ty >= CONFIG.GRID_H) return T_STEEL;
  return tiles[ty * CONFIG.GRID_W + tx];
}
