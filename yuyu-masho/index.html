<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>魔强统一战 HTML5 复刻</title>
    <style>html,body{width:100%;height:100%;background:#0b1020;height:100dvh;margin:0;padding:0;overflow:hidden}#game{width:100%;height:100%;height:100dvh;position:fixed;top:0;bottom:0;left:0;right:0}#loading{z-index:10;color:#cfe8ff;background:#0b1020;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-family:sans-serif;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#loading .ring{border:4px solid #cfe8ff40;border-top-color:#ffd23f;border-radius:50%;width:46px;height:46px;animation:.9s linear infinite spin}#loading .t{letter-spacing:1px;font-size:15px}@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" crossorigin src="./assets/index-Dadt5W0A.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-BSBLrfai.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <div class="ring"></div>
      <div class="t">魔强统一战 加载中…</div>
    </div>
    <script>
      // 静默横屏锁定 + 进入全屏：首次触摸时尝试锁定横屏并请求全屏，
      // 失败（如 iOS Safari 不支持）自动忽略，不弹任何提示。安卓 Chrome 可借此隐藏地址栏/导航栏。
      (function () {
        function enhance() {
          try {
            var so = screen.orientation;
            if (so && typeof so.lock === 'function') {
              var p = so.lock('landscape');
              if (p && typeof p.catch === 'function') p.catch(function () {});
            }
          } catch (e) { /* 忽略 */ }
          try {
            var el = document.getElementById('game');
            var doc = document as any;
            if (!doc.fullscreenElement && el && el.requestFullscreen) {
              el.requestFullscreen().catch(function () {});
            } else if (!doc.webkitFullscreenElement && el && (el as any).webkitRequestFullscreen) {
              (el as any).webkitRequestFullscreen();
            }
          } catch (e) { /* 忽略：iOS 不支持 div 全屏，静默 */ }
        }
        window.addEventListener('pointerdown', enhance, { once: true });
        window.addEventListener('touchstart', enhance, { once: true });
      })();
    </script>
  </body>
</html>
