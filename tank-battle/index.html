/* 状态变化时刷新覆盖层 */
function refreshOverlay() {
  if (G.state === lastState && G.state !== 'menu') return;
  lastState = G.state;
  if (G.state === 'menu') showMenu();
  else if (G.state === 'paused') showPause();
  else if (G.state === 'stageClear') showStageClear();
  else if (G.state === 'gameOver') showGameOver();
  else if (G.state === 'coopIntro') showOverlay('已连接', '双人同玩开始！', '', '', []);
  else hideOverlay();
}

/* --------------------------------------------------------------------------
   流程控制
   -------------------------------------------------------------------------- */
function startStage(stage) {
  loadStage(stage, G.forceRandom);
  collectTiles();
  markTerrainDirty();
}

function startGame(random, startStageNo) {
  Sound.unlock();
  G.forceRandom = !!random;
  G.score = 0;
  G.lives = CONFIG.PLAYER_LIVES;
  inputState.dir = -1;
  inputState.fire = false;
  startStage(startStageNo || 1);
  G.state = 'playing';
  lastState = '';
  refreshOverlay();
}

function togglePause() {
  if (G.state === 'playing') { G.state = 'paused'; refreshOverlay(); }
  else if (G.state === 'paused') { G.state = 'playing'; lastState = ''; refreshOverlay(); }
}

/* --------------------------------------------------------------------------
   主循环：固定时间步长 1/60 秒，渲染与逻辑分离
   -------------------------------------------------------------------------- */
var lastTs = 0, accumulator = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  var dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > CONFIG.MAX_FRAME_DT) dt = CONFIG.MAX_FRAME_DT;   // 切后台回来不要一次性跑飞

  accumulator += dt;
  var guard = 0;
  while (accumulator >= CONFIG.STEP && guard++ < 8) {
    if (Net.mode === 'guest') {
      Net.guestTick(CONFIG.STEP);          // 客机：只上传操作，不跑本地模拟
    } else {
      update(CONFIG.STEP);
      if (Net.mode === 'host') Net.hostTick(CONFIG.STEP);   // 主机：跑模拟并下发快照
    }
    accumulator -= CONFIG.STEP;
  }
  if (guard >= 8) accumulator = 0;

  if (Net.mode === 'guest') Net.guestApply(performance.now() / 1000);   // 客机：插值渲染主机快照

  render(ctx);
  updateHUD();
  if (G.state !== lastState) refreshOverlay();
  /* 背景音乐：仅在"游戏中"播放，其余状态（暂停/菜单/结算/过场）自动停止 */
  var wantBGM = (G.state === 'playing');
  if (wantBGM !== bgmWanted) { Sound.setBGM(wantBGM); bgmWanted = wantBGM; }
}

/* --------------------------------------------------------------------------
   启动
   -------------------------------------------------------------------------- */
function boot() {
  cv = $('cv');
  ctx = cv.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;
  elStage = $('stage');
  elOverlay = $('overlay');
  elTitle = $('ov-title'); elSub = $('ov-sub'); elStats = $('ov-stats');
  elTips = $('ov-tips'); elRow = $('ov-row');
  elPreview = $('menu-preview'); elStages = $('ov-stages');
  elNetPanel = $('net-panel'); elNetStatus = $('net-status');
  elNetCode = $('net-code'); elNetInput = $('net-input');
  hudStage = $('hud-stage'); hudLife = $('hud-life'); hudEnemy = $('hud-enemy');
  hudScore = $('hud-score'); hudBest = $('hud-best');
  btnSound = $('btn-sound');

  loadBest();
  Input.init();

  /* 按钮 */
  $('btn-pause').addEventListener('click', function (e) { e.preventDefault(); Sound.unlock(); togglePause(); });
  btnSound.addEventListener('click', function (e) {
    e.preventDefault();
    Sound.unlock();
    Sound.enabled = !Sound.enabled;
    btnSound.textContent = Sound.enabled ? '🔊' : '🔇';
    Sound.setBGM(G.state === 'playing');   // 静音同步到 BGM
  });

  /* 尺寸自适应：旋转屏幕 / 地址栏收放都会触发 */
  measure();
  window.addEventListener('resize', measure);
  window.addEventListener('orientationchange', function () { setTimeout(measure, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);
  setTimeout(measure, 300);

  /* 切到后台时停 BGM，回到前台且仍在游戏中则恢复，避免后台出声与回前台爆音 */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) Sound.stopBGM();
    else if (G.state === 'playing') Sound.startBGM();
  });

  /* 调试 / 调参接口：挂在 window 上，方便在控制台改数值、跳关、快进模拟 */
  window.TankDebug = {
    G: G, CONFIG: CONFIG, COLORS: COLORS, LEVELS: LEVELS, Sound: Sound, inputState: inputState,
    startGame: startGame, startStage: startStage, loadStage: loadStage,
    generateRandomMap: generateRandomMap, applyItem: applyItem, dropItem: dropItem,
    createTank: createTank, spawnBullet: spawnBullet, buildMap: buildMap,
    explode: explode, destroyBase: destroyBase, killPlayer: killPlayer,
    gameOver: gameOver, saveBest: saveBest, togglePause: togglePause,
    damageTile: damageTile, separateTanks: separateTanks, hitRect: hitRect,
    validateMap: validateMap, tileAt: tileAt,
    collectTiles: collectTiles, markTerrainDirty: markTerrainDirty,
    T: { EMPTY: T_EMPTY, BRICK: T_BRICK, STEEL: T_STEEL, WATER: T_WATER, GRASS: T_GRASS },
    /* 快进 n 帧（用于自动化验证，无需真的等 10 秒） */
    tick: function (n) { for (var i = 0; i < n; i++) update(CONFIG.STEP); },
    render: function () { render(ctx); }
  };

  /* 竖屏自适应：按"战场可用区域"的高度把战场加高，最大化利用手机纵向空间。
     纵向块数 BH_BLOCKS = 横向块数 × (可用高 / 可用宽)，并夹在 [16,28] 之间，
     这样无论什么比例的手机，战场都能铺满、上下几乎不留空。 */
  function computeBH() {
    var w = elStage ? elStage.clientWidth : 0;
    var h = elStage ? elStage.clientHeight : 0;
    if (w <= 0 || h <= 0) return CONFIG.BH_BLOCKS;   // 布局尚未就绪，用默认值
    /* 让"画布(含右侧信息栏)整体"的长宽比与战场可用区一致：
       画布宽 = CANVAS_W(224) = 28 tile = 14 块；由此反推纵向块数，
       使战场在竖屏里上下都铺满、不留空白（仅信息栏占右侧少量横向空间）。 */
    var bh = Math.round((CONFIG.CANVAS_W / CONFIG.TILE) * h / w / 2);
    return Math.max(16, Math.min(28, bh));
  }
  CONFIG.setPortraitHeight(computeBH());
  cv.width = CONFIG.CANVAS_W;
  cv.height = CONFIG.CANVAS_H;
  measure();   // 用新的画布尺寸重新缩放

  /* 菜单背景用第 1 关地图，好看一点 */
  startStage(1);
  G.state = 'menu';
  lastState = '';
  refreshOverlay();

  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
